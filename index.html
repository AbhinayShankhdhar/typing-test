<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="new_project1.css">
</head>
<body>
  <div class="container">
    <h1>Typing Speed Test</h1>
    <div class="stats">
      <p>Time: <span id="time">30</span>s</p>
      <p>WPM: <span id="wpm">0</span></p>
      <p>Accuracy: <span id="accuracy">100</span>%</p>
    </div>

    <p id="text-display"></p>

    <textarea id="input" placeholder="Start typing here..."></textarea>
     <!-- <textarea name="input" placeholder="Start typing here..."></textarea> -->
      <p id="result"></p>
    <button id="restart">Restart</button>
  </div>

  <script src="new_project1.js"></script>
</body>
</html>
